<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiga Hari Gym</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tiga Hari Gym">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:"Barlow";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
/* Layout idea: dark fitness-app shell. Workout hero tinted by plate colour (A red, B blue, C yellow, Abs green), activity rings, full-screen workout player with sticky action bar, circular rest timer, floating tab bar. Single dark theme by design. */
:root{
  --bg:#0b0d10; --surface:#15181d; --surface2:#1c2027; --surface3:#272c35; --ink:#f3f5f7; --muted:#8d97a3; --line:#252a32;
  --accent:#ff6a2b; --accent2:#ff2e63; --accent-ink:#ffffff;
  --a:#ff4b4b; --b:#4c8dff; --c:#ffc83d; --abs:#34d27b; --good:#34d27b; --warn:#ffb020;
  --grad:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 100%);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:20px; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1.02;text-wrap:balance}
h1{font-size:20px;white-space:nowrap}
h2{font-size:26px}
h3{font-size:19px}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
.w-A1,.w-A2{--wc:var(--a);--wc2:#b3122f;--wink:#fff} .w-B1,.w-B2{--wc:var(--b);--wc2:#2340b8;--wink:#fff} .w-C1,.w-C2{--wc:var(--c);--wc2:#ff8a00;--wink:#1d1300} .w-ABS{--wc:var(--abs);--wc2:#0e8f6e;--wink:#04140c}

.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:calc(env(safe-area-inset-top) + 10px) 18px 10px;display:flex;align-items:center;gap:10px}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;flex:none;display:block}
.logo svg{width:100%;height:100%;display:block}
.lg .db{transform-box:view-box;animation:dbIn .7s cubic-bezier(.2,1.3,.4,1) both,dbNudge 5s ease-in-out 2s infinite}
.lg .sl line{transform-box:fill-box;transform-origin:100% 50%;animation:slIn .5s ease-out both,slLoop 5s ease-in-out 2s infinite}
.lg .s1{animation-delay:.35s,2.05s} .lg .s2{animation-delay:.25s,2s} .lg .s3{animation-delay:.45s,2.1s}
@keyframes dbIn{0%{transform:translateX(-16px);opacity:0}60%{transform:translateX(2px);opacity:1}100%{transform:translateX(0)}}
@keyframes dbNudge{0%,80%,100%{transform:translateX(0)}86%{transform:translateX(-2.5px)}92%{transform:translateX(1.5px)}}
@keyframes slIn{0%{transform:scaleX(0);opacity:0}100%{transform:scaleX(1);opacity:1}}
@keyframes slLoop{0%,80%,100%{transform:scaleX(1);opacity:1}86%{transform:scaleX(1.45);opacity:.6}92%{transform:scaleX(.8);opacity:1}}
.brand h1{font-style:normal;transform:skewX(-8deg);transform-origin:left bottom}
.splash{position:fixed;inset:0;z-index:90;background:radial-gradient(70% 50% at 50% 42%,color-mix(in srgb,var(--accent2) 22%,var(--bg)) 0%,var(--bg) 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .45s ease,visibility .45s;cursor:pointer}
.splash.out{opacity:0;visibility:hidden}
.splash .logo{width:112px;height:112px;filter:drop-shadow(0 16px 36px color-mix(in srgb,var(--accent2) 55%,transparent))}
.splash .logo svg{animation:lgPop .6s cubic-bezier(.3,1.4,.5,1) both}
.wm{font-family:var(--display);font-weight:700;font-size:42px;letter-spacing:.05em;text-transform:uppercase;display:flex;gap:.26em;line-height:1;transform:skewX(-9deg);position:relative;padding-bottom:12px}
.wm::after{content:"";position:absolute;left:8%;right:-4%;bottom:0;height:4px;border-radius:4px;background:var(--grad);transform-origin:left;animation:swoosh .55s cubic-bezier(.2,.9,.3,1) .85s both}
@keyframes swoosh{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
.wm span{display:inline-block;animation:wmUp .55s cubic-bezier(.2,.9,.3,1) both}
.wm span:nth-child(1){animation-delay:.45s} .wm span:nth-child(2){animation-delay:.58s} .wm span:nth-child(3){animation-delay:.71s;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.splash small{color:var(--muted);font-size:14px;letter-spacing:.04em;animation:wmUp .5s ease .95s both}
@keyframes lgPop{0%{transform:scale(.6) rotate(-8deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes wmUp{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){.lg .db,.lg .sl line,.splash .logo svg,.wm span,.wm::after,.splash small{animation:none!important}}
.brand .t{display:flex;flex-direction:column;min-width:0}
.sync{font-size:11px;font-weight:600;color:var(--muted)}
.sync.cloud{color:var(--good)} .sync.local{color:var(--warn)}
.icon-btn{width:42px;height:42px;border-radius:14px;border:0;background:var(--surface2);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);text-decoration:none;flex:none}
.icon-btn svg{width:21px;height:21px}
body.focus .top{display:none}

main{max-width:560px;margin:0 auto;padding:6px 18px calc(130px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:16px}
body.focus main{padding-top:calc(env(safe-area-inset-top) + 12px);padding-bottom:calc(120px + env(safe-area-inset-bottom))}
.card{background:var(--surface);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.sec-h{display:flex;justify-content:space-between;align-items:baseline}
.sec-h a{font-size:14px;font-weight:600;text-decoration:none}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface3);white-space:nowrap}
.chip.w{background:var(--wc);color:var(--wink)}
.chip.pr{background:color-mix(in srgb,var(--good) 20%,transparent);color:var(--good)}
.tag{font-family:var(--display);font-weight:700;letter-spacing:.03em;color:var(--wc)}
.stripe{box-shadow:inset 4px 0 0 var(--wc,transparent)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;background:var(--surface2);border-radius:16px;padding:12px 18px;font-weight:700;cursor:pointer;min-height:50px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--grad);color:#fff;box-shadow:0 8px 24px -8px color-mix(in srgb,var(--accent2) 70%,transparent)}
.btn.big{width:100%;font-family:var(--display);font-size:21px;text-transform:uppercase;letter-spacing:.05em;min-height:58px}
.btn.sm{min-height:40px;padding:8px 14px;font-size:14px;border-radius:12px}
.btn.link{background:transparent;color:var(--muted);min-height:40px;padding:6px 4px;font-weight:600}
.btn.danger{background:color-mix(in srgb,var(--accent2) 14%,transparent);color:var(--accent2)}
.btn:disabled{opacity:.4}
.seg{display:flex;gap:4px;background:var(--surface);border-radius:16px;padding:5px}
.seg button{flex:1;border:0;background:transparent;border-radius:12px;padding:9px 6px;font-weight:700;font-size:14px;cursor:pointer;min-height:42px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface3);color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:0;background:var(--surface2);border-radius:999px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;min-height:40px;color:var(--ink)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* floating tab bar */
.nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;max-width:536px;margin:0 auto;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:24px;display:grid;grid-template-columns:repeat(4,1fr);padding:6px;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:700;border-radius:18px;position:relative;letter-spacing:.02em}
.nav a svg{width:23px;height:23px}
.nav a[aria-current="page"]{color:var(--ink);background:var(--surface3)}
.nav a[aria-current="page"] svg{color:var(--accent)}
.nav .dot{position:absolute;top:6px;left:calc(50% + 9px);width:8px;height:8px;border-radius:50%;background:var(--accent2)}
body.focus .nav{display:none}

/* home */
.greet{display:flex;flex-direction:column;gap:2px;padding-top:4px}
.greet h2{font-size:32px}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:22px;color:var(--wink);background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,#fff 18%,transparent) 0%,transparent 55%),linear-gradient(140deg,var(--wc) 0%,var(--wc2) 100%);display:flex;flex-direction:column;gap:10px;min-height:220px}
.hero::after{content:"";position:absolute;right:-30px;bottom:-40px;width:180px;height:180px;border-radius:50%;border:26px solid color-mix(in srgb,#fff 12%,transparent)}
.hero>*{position:relative;z-index:1}
.hero .eb{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.hero .ttl{font-family:var(--display);font-size:48px;font-weight:700;line-height:.95;text-transform:uppercase}
.hero .sub{font-size:16px;opacity:.9}
.hero .hc{display:flex;gap:8px;flex-wrap:wrap}
.hero .hc span{font-size:13px;font-weight:700;padding:5px 11px;border-radius:999px;background:color-mix(in srgb,#000 22%,transparent)}
.w-C1.hero .hc span,.w-C2.hero .hc span{background:color-mix(in srgb,#000 12%,transparent)}
.go{margin-top:auto;align-self:flex-start;display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;background:#fff;color:#111;font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:12px 22px 12px 14px;cursor:pointer;text-decoration:none;box-shadow:0 10px 24px -8px rgba(0,0,0,.5)}
.go i{width:34px;height:34px;border-radius:50%;background:var(--wc2);display:flex;align-items:center;justify-content:center}
.go i svg{width:16px;height:16px;color:#fff;margin-left:2px}
.go.ghost{background:color-mix(in srgb,#000 25%,transparent);color:var(--wink);box-shadow:none;padding:12px 20px}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ringbox{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.ringbox>span{font-size:12px;color:var(--muted);font-weight:600}
.ring{position:relative}
.ring svg{width:100%;height:100%;display:block}
.ring-in{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display)}
.ring-in b{font-size:26px;line-height:1}
.ring-in span{font-size:14px;color:var(--muted);margin-top:6px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
.week b{width:100%;max-width:42px;aspect-ratio:1;border-radius:14px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted)}
.week b.done{background:var(--wc);color:var(--wink)}
.week b.plan{box-shadow:inset 0 0 0 2px var(--wc);color:var(--wc)}
.week .today{color:var(--ink)}
.week .today b{outline:2px solid var(--ink);outline-offset:2px}
.exrow{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center}
.exicon{width:44px;height:44px;border-radius:14px;background:color-mix(in srgb,var(--wc) 18%,transparent);color:var(--wc);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:20px}
.exrow b{display:block;font-size:15px;line-height:1.25}
.exrow .s{font-size:13px;color:var(--muted)}
.exrow .rt{font-family:var(--display);font-weight:700;font-size:18px;text-align:right}
.exrow .rt small{display:block;font-family:var(--body);font-size:11px;color:var(--muted);font-weight:600}

/* workout player */
.ptop{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center}
.ptop .mid{display:flex;align-items:center;gap:8px;font-weight:700}
.timer{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-size:20px;font-weight:700;background:var(--surface2);border-radius:12px;padding:6px 10px}
.timer svg{width:16px;height:16px;color:var(--accent)}
.steps{display:flex;gap:6px}
.steps button{flex:1;height:6px;border-radius:99px;border:0;background:var(--surface3);cursor:pointer;padding:0}
.steps button.done{background:var(--good)}
.steps button.on{background:var(--grad)}
.exname{font-size:36px;line-height:.98}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pills span{font-size:13px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--surface2);color:var(--ink)}
.pills span.m{background:color-mix(in srgb,var(--wc) 20%,transparent);color:var(--wc)}
.last{display:flex;align-items:center;gap:10px;font-size:14px;background:var(--surface2);border-radius:14px;padding:10px 12px}
.last svg{width:18px;height:18px;color:var(--muted);flex:none}
.last b{font-variant-numeric:tabular-nums}
.sethead,.set{display:grid;grid-template-columns:52px 1fr 1fr 54px;gap:8px;align-items:center}
.sethead{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;text-align:center;font-weight:700}
.set{padding:8px;border-radius:18px;background:var(--surface2);transition:background .2s}
.sets{display:flex;flex-direction:column;gap:8px}
.set .lb{display:flex;flex-direction:column;align-items:center;line-height:1.05}
.set .lb b{width:34px;height:34px;border-radius:50%;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:19px}
.set .lb span{font-size:10px;color:var(--muted);margin-top:3px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.set input{width:100%;min-width:0;padding:12px 4px;border:0;border-radius:14px;background:var(--surface3);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;font-family:var(--display)}
.set input::placeholder{color:var(--muted);font-weight:600;font-size:17px}
.set input:focus{outline:2px solid var(--accent);outline-offset:0}
.chk{width:54px;height:54px;border-radius:16px;border:0;background:var(--surface3);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.chk svg{width:26px;height:26px}
.set.done{background:color-mix(in srgb,var(--good) 14%,var(--surface2))}
.set.done .chk{background:var(--good);color:#04140c}
.set.done .lb b{background:var(--good);color:#04140c}
.now .val[data-f="w"]{visibility:hidden}
.set .val{width:100%;min-width:0;min-height:50px;padding:10px 4px;border:0;border-radius:14px;background:var(--surface3);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;font-family:var(--display);color:var(--ink);cursor:pointer}
.set .val.ph{color:var(--muted);font-weight:600;font-size:17px}
.set .val:active{transform:scale(.97)}
.set.done .val{box-shadow:inset 0 0 0 2px var(--good)}
.pk-h{display:flex;flex-direction:column;gap:2px}
.pk-lbl{display:grid;grid-template-columns:1.1fr .8fr 1fr;gap:8px;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;text-align:center}
.pk{display:grid;grid-template-columns:1.1fr .8fr 1fr;gap:8px;position:relative;height:220px}
.pk.now{grid-template-columns:1fr} .pk-lbl.now{grid-template-columns:1fr}
.pk-band{position:absolute;left:0;right:0;top:88px;height:44px;border-radius:12px;background:var(--surface3);pointer-events:none}
.wheel{position:relative;height:220px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;-webkit-mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent);mask-image:linear-gradient(transparent,#000 32%,#000 68%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wheel div{height:44px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-family:var(--display);font-size:26px;font-weight:700;color:var(--muted);cursor:pointer;font-variant-numeric:tabular-nums;transition:color .1s,transform .1s}
.wheel div.on{color:var(--ink);transform:scale(1.12)}
.wheel .pad{height:88px;scroll-snap-align:none;cursor:default}
.pk-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pfoot{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.pfoot .in{max-width:524px;margin:0 auto;display:grid;grid-template-columns:58px 1fr;gap:10px}
.pfoot .back{min-height:58px;border-radius:18px;padding:0}
details{border-radius:14px}
details summary{cursor:pointer;font-weight:700;color:var(--muted);font-size:14px;min-height:40px;display:flex;align-items:center;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);margin:0 10px 0 2px;transition:transform .15s}
details[open] summary::before{transform:rotate(45deg)}
details>div,details>ul{margin-top:8px}
.cues{margin:0;padding-left:20px;color:var(--ink)}
.cues li{margin:4px 0}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field select,.field textarea{padding:12px;border:0;border-radius:14px;background:var(--surface2);min-height:48px;width:100%}
.toggle{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.checklist{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.checklist li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;font-size:15px}
.checklist li i{width:28px;height:28px;border-radius:50%;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;font-weight:700;color:var(--muted)}
.checklist li.ok i{background:var(--good);color:#04140c}
.checklist button{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--ink);font-weight:600}

/* rest timer */
.rest{position:fixed;inset:0;z-index:50;display:none}
.rest.on{display:block}
.rest-sheet{position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:24px}
.rest-lb{font-size:15px;color:var(--muted);text-align:center;max-width:300px}
.rest-ring{position:relative;width:250px;height:250px}
.rest-ring svg{width:100%;height:100%;display:block}
.rest-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rest-t{font-family:var(--display);font-size:68px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.rest-sub{font-size:13px;letter-spacing:.2em;font-weight:700;color:var(--accent)}
.rest-btns{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:10px;width:100%;max-width:340px}
.rest-btns button{min-height:54px;border:0;border-radius:16px;background:var(--surface2);font-weight:700;cursor:pointer;color:var(--ink)}
.rest-btns .skip{background:var(--grad);color:#fff}
.rest-min{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:18px}
.rest-mini{display:none;position:absolute;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));border:0;border-radius:999px;background:var(--grad);color:#fff;font-family:var(--display);font-size:22px;font-weight:700;padding:10px 18px;cursor:pointer;box-shadow:0 10px 26px -6px rgba(0,0,0,.6)}
.rest.mini{inset:auto 0 0 auto;width:0;height:0}
.rest.mini .rest-sheet{display:none}
.rest.mini .rest-mini{display:block;position:fixed}
.rest.end .rest-sub{color:var(--good)}
.rest.end .rest-mini{background:var(--good);color:#04140c}

/* dashboard */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.tile i{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--tc,var(--accent)) 18%,transparent);color:var(--tc,var(--accent));margin-bottom:6px}
.tile i svg{width:18px;height:18px}
.tile b{font-family:var(--display);font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted)}
.att{display:grid;grid-template-columns:24px repeat(12,1fr);gap:4px;align-items:center}
.att .h{font-size:10px;color:var(--muted);text-align:center;font-weight:600}
.att .rl{font-family:var(--display);font-weight:700;font-size:14px;color:var(--wc)}
.att i{display:block;aspect-ratio:1;border-radius:6px;background:var(--surface2)}
.att i.on{background:var(--wc)}
.att i.fut{opacity:.45}
.att i.cur{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--wc);display:inline-block}
.lift{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:14px 0;border:0;border-top:1px solid var(--line);cursor:pointer;background:none;text-align:left;width:100%;color:inherit}
.lift:first-of-type{border-top:0}
.lift .nm{font-weight:700;font-size:15px}
.lift .val{font-size:14px;color:var(--muted)}
.lift .val b{color:var(--ink);font-variant-numeric:tabular-nums}
.lift svg{grid-row:1 / span 2;grid-column:2;width:96px;height:38px}
.delta{font-weight:700;font-size:13px}
.delta.up{color:var(--good)} .delta.flat{color:var(--muted)} .delta.bad{color:var(--warn)}
.wrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.wrow:first-of-type{border-top:0}
.wsp svg{width:90px;height:40px}
.demo{background:radial-gradient(90% 80% at 50% 30%,color-mix(in srgb,var(--accent) 10%,var(--surface2)) 0%,var(--surface2) 70%)}
details .demo{border-radius:16px;overflow:hidden;margin:6px 0 10px}
.demo svg{width:100%;height:auto;display:block;max-height:250px}
.log-demo .demo svg{max-height:185px}
.log-demo .demo-bar{padding-top:2px}
.demo-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px 10px}
.demo-ph{font-family:var(--display);font-weight:700;font-size:19px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.demo-pp{width:38px;height:38px;border-radius:50%;border:0;background:var(--surface3);color:var(--ink);cursor:pointer;font-size:12px;flex:none}
.watch{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px}
.btn.yt{background:#ff0033;color:#fff}
.btn.yt svg{width:16px;height:16px}
button.tile{font:inherit}
.detail{padding:4px 0 14px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
td.r,th.r{text-align:right}
.chart-wrap{position:relative}
.chart-wrap svg{width:100%;height:auto;display:block;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:6px 9px;border-radius:10px;white-space:nowrap;transform:translate(-50%,-125%);display:none}
.empty{text-align:center;color:var(--muted);padding:26px 12px}
.wkgrid{display:flex;flex-direction:column;gap:8px}
.wk{background:var(--surface2);border-radius:14px;overflow:hidden}
.wk-h{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;font-weight:700;font-size:14px}
.wk-h span{font-weight:600;color:var(--muted);font-size:12px}
.wk table{font-size:13px}
.wk td{border-color:var(--surface3)}
.wk.wk-empty{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.wk.wk-empty .wk-h{color:var(--muted);font-weight:600}
.wk.cur{box-shadow:inset 0 0 0 2px var(--accent)}
.hist{cursor:pointer}
.hist-det{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.hist-det .s{font-size:14px;color:var(--muted)}

.guide p,.guide ul{max-width:65ch}
.guide ul{margin:0;padding-left:20px}
.ex-eg{font-variant-numeric:tabular-nums;background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}
.tipcard summary{font-family:var(--display);font-size:19px;text-transform:uppercase;letter-spacing:.02em;color:var(--ink)}
.tipcard>div{display:flex;flex-direction:column;gap:8px}

.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;padding:12px}
.modal .box{background:var(--surface);color:var(--ink);border-radius:26px;max-width:520px;width:100%;padding:22px;display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow:auto}
.modal textarea{width:100%;min-height:160px;border:0;border-radius:12px;padding:10px;font-family:ui-monospace,monospace;font-size:12px;background:var(--surface2)}
.celebrate{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.celebrate .ring-in svg{width:44px;height:44px;color:var(--good)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 70px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:700;z-index:70;font-size:14px;display:none;max-width:90vw}
.toast.on{display:block}
.pick{display:grid;gap:12px}
.pick .hero{min-height:0;text-align:left;border:0;cursor:pointer;font:inherit}
.pick .hero .ttl{font-size:36px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

</head>

  machineFlye:{name:"Machine Flye",inc:2.5,yt:"pec deck machine fly form",

const ABS = {

const GUIDE = [
 {h:{ms:"Cara program ini berjalan",en:"How this program works"},
  b:{ms:`<p>Program ada dua fasa 12 minggu: <b>Fasa 1</b> (A1, B1, C1) untuk 12 minggu pertama dan <b>Fasa 2</b> (A2, B2, C2) untuk 12 minggu seterusnya. Tiga sesi seminggu, setiap satu 4 senaman × 3 set, kira-kira 45 minit hingga 1 jam. Jadual asal: Isnin, Rabu, Sabtu. Anda boleh tukar hari di Tetapan, asalkan <b>bukan hari berturut-turut</b>: otot dan sistem saraf perlukan kira-kira 48 jam untuk pulih sepenuhnya.</p>`,
     en:`<p>The program has two 12-week phases: <b>Phase 1</b> (A1, B1, C1) for the first 12 weeks and <b>Phase 2</b> (A2, B2, C2) for the next 12. Three sessions a week, each with 4 exercises × 3 sets, about 45 minutes to 1 hour. Default days: Monday, Wednesday, Saturday. You can change the days in Settings as long as they are <b>not back-to-back</b>: muscles and the nervous system need about 48 hours to fully recover.</p>`}},
 {h:{ms:"Progressive overload — kunci utama",en:"Progressive overload — the main key"},

/* ---------- history logic ---------- */
function entriesFor(hk, excludeId){
  const out=[];
  for(const s of allSessions()){
    if(s.id===excludeId) continue;
    for(const e of (s.exercises||[])) if(e.hk===hk){ const sets=(e.sets||[]).filter(validSet).map(x=>({w:num(x.w),r:num(x.r)})); if(sets.length) out.push({date:s.date,id:s.id,method:e.method,sets}); }
  }
  return out;
}
function bestOf(sets){ let b=null; for(const s of sets){ const v=e1rm(s.w,s.r); if(!b||v>b.v) b={w:s.w,r:s.r,v}; } return b; }
function topSet(sets,assist){ let b=null; for(const s of sets){ if(!b||(assist?(s.w<b.w||(s.w===b.w&&s.r>b.r)):(s.w>b.w||(s.w===b.w&&s.r>b.r)))) b=s; } return b; }
function targetsFor(key, method, hk){
  const M=METHODS[method], ex=EX[key], dir=ex.assist?-1:1;
  const last=entriesFor(hk, draft&&draft.id).find(e=>e.method===method);
  const rng=([lo,hi])=>`${lo}–${hi}`;
  if(!last) return M.targets.map(t=>({w:null,txt:rng(t)}));
  const adj=w=>Math.max(0,Math.round((w+dir*ex.inc)*100)/100);
  if(method==="STR"){
    const all12=last.sets.length>=3 && last.sets.slice(0,3).every(s=>s.r>=12);
    return [0,1,2].map(i=>{ const P=last.sets[i]||last.sets[last.sets.length-1]; return all12?{w:adj(P.w),txt:"8–12"}:{w:P.w,txt:`≥${Math.min(P.r+1,12)}`}; });
  }
  return M.targets.map(([lo,hi],i)=>{ const P=last.sets[i]; if(!P) return {w:null,txt:rng([lo,hi])}; return P.r>=hi?{w:adj(P.w),txt:rng([lo,hi])}:{w:P.w,txt:`≥${P.r+1}`}; });
}
function applyTargets(e){
  const tg=targetsFor(e.key,e.method,hkOf(e.key,e.smith));
  e.sets.forEach((s,k)=>{ if(s.d) return; if(s.w===""||s.auto){ const t=tg[k]; s.w = t&&t.w!=null ? fmtN(t.w) : ""; s.auto = !!(t&&t.w!=null); } });
}

/* ---------- schedule ---------- */
function weekInfo(){ const diff=Math.floor((parseD(todayStr())-parseD(settings.start[settings.phase]))/86400000); return {week:Math.floor(diff/7)+1,diff}; }
function weekOf(date, ph){ const st=settings.start[ph]; if(!st) return null; const d=Math.floor((parseD(date)-parseD(st))/86400000); return d<0?null:Math.floor(d/7)+1; }
function endOf(ph){ const d=parseD(settings.start[ph]); d.setDate(d.getDate()+83); return dstr(d); }
function scheduledFor(dow){ const l=["A","B","C"].find(x=>settings.days[x]===dow); return l?l+settings.phase:null; }
function consecutive(){ const d=["A","B","C"].map(w=>settings.days[w]); if(new Set(d).size<3) return true; return d.some(a=>d.some(b=>a!==b&&((a-b+7)%7===1))); }
function nextWorkout(){ const now=new Date(); for(let i=1;i<=7;i++){ const d=new Date(now); d.setDate(now.getDate()+i); const w=scheduledFor(d.getDay()); if(w) return {w,d}; } return null; }
function mondayOf(d){ const m=new Date(d); m.setHours(0,0,0,0); m.setDate(m.getDate()-((m.getDay()+6)%7)); return m; }
function sessFor(list, wid, wk){ const ph=+wid[1]; return list.find(s=>s.workout===wid && weekOf(s.date,ph)===wk) || null; }

/* ---------- animated exercise demos (own drawings) ---------- */
const SEG={torso:48,neck:11,head:8,ua:26,fa:24,th:38,sh:36,ft:12};
const dRad=a=>a*Math.PI/180, dv=(a,l)=>[l*Math.cos(dRad(a)),-l*Math.sin(dRad(a))], dAdd=(p,v)=>[p[0]+v[0],p[1]+v[1]];
function ik2(a,t,L1,L2,bend){
  const dx=t[0]-a[0], dy=t[1]-a[1]; let d=Math.hypot(dx,dy); d=Math.max(1,Math.min(d,L1+L2-0.01));
  const base=Math.atan2(dy,dx), A=Math.acos(Math.max(-1,Math.min(1,(L1*L1+d*d-L2*L2)/(2*L1*d))));
  const ang=base+bend*A; return [a[0]+L1*Math.cos(ang), a[1]+L1*Math.sin(ang)];
}
function fkSide(p,c){
  const T=p.t, hip=[0,0], sh=dAdd(hip,dv(T,SEG.torso)), hd=dAdd(sh,dv(T,SEG.neck+SEG.head-2));
  const ua=c.rel?p.ua+T:p.ua, fa=c.rel?p.fa+T:p.fa, el=dAdd(sh,dv(ua,SEG.ua)), wr=dAdd(el,dv(fa,SEG.fa));
  const kn=dAdd(hip,dv(p.th,SEG.th)), an=dAdd(kn,dv(p.sh,SEG.sh)), to=dAdd(an,dv(p.ft??0,SEG.ft));
  const j={hip,sh,hd,el,wr,kn,an,to};
  if(p.ua2!=null){ const u2=c.rel?p.ua2+T:p.ua2, f2=c.rel?p.fa2+T:p.fa2; j.el2=dAdd(sh,dv(u2,SEG.ua)); j.wr2=dAdd(j.el2,dv(f2,SEG.fa)); }
  if(p.th2!=null){ j.kn2=dAdd(hip,dv(p.th2,SEG.th)); j.an2=dAdd(j.kn2,dv(p.sh2,SEG.sh)); j.to2=dAdd(j.an2,dv(p.ft2??0,SEG.ft)); }
  const a=j[c.anchor], off=[c.at[0]-a[0], c.at[1]-a[1]];
  for(const k in j) j[k]=dAdd(j[k],off);
  if(c.ik){ j.kn2=ik2(j.hip,c.ik,SEG.th,SEG.sh,c.ikBend||1); j.an2=c.ik; j.to2=dAdd(c.ik,dv(c.ikFoot??180,SEG.ft)); }
  return j;
}
function fkFront(p,c){
  const cx=120, top=c.seated?60:40, sR=[cx+17,top+14], sL=[cx-17,top+14], hd=[cx,top-2], hip=[cx,top+60];
  const arm=(sh,side)=>{ let el,wr;
    if(c.kind==="raise"){ el=dAdd(sh,[side*SEG.ua*Math.cos(dRad(p.a)),-SEG.ua*Math.sin(dRad(p.a))]); const b=p.a+(p.b||0); wr=dAdd(el,[side*SEG.fa*Math.cos(dRad(b)),-SEG.fa*Math.sin(dRad(b))]); }
    else if(c.kind==="fly"){ el=dAdd(sh,[side*(-12+42*p.sp),3]); wr=dAdd(el,[side*2*p.sp,-26]); }
    else { el=dAdd(sh,[side*(-12+42*p.sp),3]); wr=dAdd(el,[side*(-6+34*p.sp),0]); }
    return [el,wr]; };
  const [elR,wrR]=arm(sR,1), [elL,wrL]=arm(sL,-1);
  const legs=c.seated?{kR:[cx+12,hip[1]+6],aR:[cx+14,152],kL:[cx-12,hip[1]+6],aL:[cx-14,152]}:{kR:[cx+9,hip[1]+(152-hip[1])/2],aR:[cx+11,152],kL:[cx-9,hip[1]+(152-hip[1])/2],aL:[cx-11,152]};
  return {front:1,hd,sR,sL,hip,elR,wrR,elL,wrL,...legs};
}

const charts={};
function chartSvg(id, pts, unit){
  charts[id]=pts;

  if(!pts.length) return "";

  if(lo===hi){ lo=Math.max(0,lo-5); hi=hi+5; }

  const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=stepRaw)||10*mag;

  const line=pts.map((p,i)=>`${i?"L":"M"}${x(i)},${y(p.w)}`).join("");
  const area=pts.length>1?`<path d="${line}L${x(pts.length-1)},${H-mb}L${x(0)},${H-mb}Z" fill="var(--accent)" opacity=".1"/>`:"";
  const xl=`<text x="${x(0)}" y="${H-6}" font-size="11" fill="var(--muted)" text-anchor="${pts.length>1?"start":"middle"}">${fmtDate(pts[0].date)}</text>`+(pts.length>1?`<text x="${x(pts.length-1)}" y="${H-6}" font-size="11" fill="var(--muted)" text-anchor="end">${fmtDate(pts[pts.length-1].date)}</text>`:"");
  const dots=pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.w)}" r="${i===pts.length-1?6:4}" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`).join("");
  return `<div class="chart-wrap" id="${id}" data-unit="${unit}"><svg viewBox="0 0 ${W} ${H}" role="img"><defs><linearGradient id="lg-${id}" x1="0" x2="1"><stop offset="0" stop-color="#ff6a2b"/><stop offset="1" stop-color="#ff2e63"/></linearGradient></defs>${g}${area}<path d="${line}" fill="none" stroke="url(#lg-${id})" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${dots}${xl}</svg><div class="tip"></div></div>`;
}
function wireCharts(){

    if(!Array.isArray(pts)){ const D=pts;
      const mv=ev=>{ const r=svg.getBoundingClientRect(), px=(ev.clientX-r.left)/r.width*D.W; let i=0,b=1e9; D.xs.forEach((x,k)=>{const d=Math.abs(x-px); if(d<=b){b=d;i=k;}});
        tip.textContent=D.txt(i); tip.style.left=(D.xs[i]/D.W*r.width)+"px"; tip.style.top=(D.ys[i]/D.H*r.height)+"px"; tip.style.display="block"; };
      svg.addEventListener("pointermove",mv); svg.addEventListener("pointerdown",mv); svg.addEventListener("pointerleave",()=>{tip.style.display="none"}); return; }
    const W=360,H=190,ml=36,mr=12;

/* ----- weight loss tracker ----- */
function weighIns(){
  const m=new Map();
  for(const s of allSessions()){ const v=num(s.bw); if(v) m.set(s.date,{d:s.date,kg:v,src:"s"}); }
  for(const e of (weight.entries||[])) m.set(e.d,{...e});
  return [...m.values()].sort((a,b)=>a.d.localeCompare(b.d));
}
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
function avg7(E,i){ const t=parseD(E[i].d); const xs=E.filter(e=>{const dd=(t-parseD(e.d))/864e5; return dd>=0&&dd<7;}); return mean(xs.map(e=>e.kg)); }
function wStats(){
  const E=weighIns(); if(!E.length) return null;
  const start=E[0], cur=E[E.length-1], goal=num(weight.goal), lose=goal!=null?goal<start.kg:true;
  const curAvg=avg7(E,E.length-1), t0=parseD(cur.d);
  const rec=E.filter(e=>(t0-parseD(e.d))/864e5<=28);
  let rate=null;
  if(rec.length>=2){ const xs=rec.map(e=>(parseD(e.d)-t0)/864e5), ys=rec.map(e=>e.kg); if(Math.max(...xs)-Math.min(...xs)>=6){ const mx=mean(xs),my=mean(ys); let nu=0,de=0; xs.forEach((x,i)=>{nu+=(x-mx)*(ys[i]-my);de+=(x-mx)**2;}); rate=de?nu/de*7:null; } }
  const progress=goal!=null&&start.kg!==goal?Math.max(0,Math.min(1,(start.kg-cur.kg)/(start.kg-goal))):null;
  const remaining=goal!=null?cur.kg-goal:null;
  const reached=goal!=null&&(lose?cur.kg<=goal:cur.kg>=goal);
  let eta=null;
  if(goal!=null&&!reached&&rate!=null&&Math.abs(rate)>=0.05&&Math.sign(rate)===Math.sign(goal-cur.kg)){ const d=new Date(t0); d.setDate(d.getDate()+Math.round(Math.abs(remaining)/Math.abs(rate)*7)); eta=dstr(d); }
  const h=num(weight.height), bmi=h?cur.kg/((h/100)**2):null;
  const fast=lose&&rate!=null&&-rate>0.01*cur.kg;
  const waists=E.filter(e=>num(e.waist)); 
  return {E,start,cur,goal,lose,curAvg,rate,progress,remaining,reached,eta,bmi,fast,waistNow:waists.length?waists[waists.length-1]:null,waistStart:waists.length?waists[0]:null};
}
function bmiCat(b){ const c=L().bmiCat; return b<18.5?c[0]:b<23?c[1]:b<27.5?c[2]:c[3]; }
function dTxt(v,lose){ const L_=L(); if(Math.abs(v)<0.05) return `<span class="delta flat">± 0 kg</span>`; const good=lose?v<0:v>0; return `<span class="delta ${good?"up":"bad"}">${v<0?"▼":"▲"} ${fmtN(Math.abs(Math.round(v*10)/10))} kg</span>`; }
function weightChart(E,goal){

  const t0=parseD(E[0].d), dd=e=>(parseD(e.d)-t0)/864e5, span=Math.max(1,dd(E[E.length-1]));
  const vals=E.map(e=>e.kg).concat(goal!=null?[goal]:[]);
  let lo=Math.min(...vals), hi=Math.max(...vals); if(hi-lo<2){ lo-=1; hi+=1; }
  const stepRaw=(hi-lo)/4, mag=Math.pow(10,Math.floor(Math.log10(stepRaw))), step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=stepRaw)||10*mag;
  lo=Math.floor(lo/step)*step; hi=Math.ceil(hi/step)*step;

  let g=""; for(let v=lo; v<=hi+1e-9; v+=step) g+=`<line x1="${ml}" x2="${W-mr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${ml-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtN(v)}</text>`;
  const av=E.map((e,i)=>avg7(E,i));
  const line=E.map((e,i)=>`${i?"L":"M"}${x(e).toFixed(1)},${y(av[i]).toFixed(1)}`).join("");
  const gl=goal!=null?`<line x1="${ml}" x2="${W-mr}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--good)" stroke-width="1.5" stroke-dasharray="5 5"/><text x="${W-mr}" y="${y(goal)-6}" text-anchor="end" font-size="11" font-weight="700" fill="var(--good)">${L().wGoal} ${fmtN(goal)}</text>`:"";
  const dots=E.map((e,i)=>`<circle cx="${x(e).toFixed(1)}" cy="${y(e.kg).toFixed(1)}" r="${i===E.length-1?6:3.5}" fill="${i===E.length-1?"var(--abs)":"color-mix(in srgb,var(--abs) 55%,transparent)"}" stroke="var(--surface)" stroke-width="${i===E.length-1?2:0}"/>`).join("");

  charts[id]={W,H,xs:E.map(e=>x(e)),ys:E.map(e=>y(e.kg)),txt:i=>`${fmtN(E[i].kg)} kg · ${fmtDate(E[i].d)} · ${L().wAvgShort} ${fmtN(Math.round(av[i]*10)/10)}`};
  return `<div class="chart-wrap" id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(L().wChart)}">${g}${gl}${E.length>1?`<path d="${line}" fill="none" stroke="var(--abs)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`:""}${dots}${xl}</svg><div class="tip"></div></div>

}

/* ---------- rest timer ---------- */
const rest={end:0,total:0,iv:null,hide:null,label:""};
let actx=null;
function beep(){
  try{ if(actx){ const t=actx.currentTime; [0,0.25,0.5].forEach(o=>{const os=actx.createOscillator(),g=actx.createGain(); os.frequency.value=880; g.gain.setValueAtTime(0.0001,t+o); g.gain.exponentialRampToValueAtTime(0.3,t+o+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+o+0.18); os.connect(g).connect(actx.destination); os.start(t+o); os.stop(t+o+0.2);}); } }catch(e){}
  try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){}
}
function startRest(sec,label){
  try{ if(!actx){ const C=window.AudioContext||window.webkitAudioContext; if(C) actx=new C(); } if(actx&&actx.state==="suspended") actx.resume(); }catch(e){}
  clearInterval(rest.iv); clearTimeout(rest.hide);
  rest.total=sec; rest.end=Date.now()+sec*1000; rest.label=label;
  const r=$("#rest"); r.classList.add("on"); r.classList.remove("end","mini");
  $("#rest-skip").textContent=L().restSkip; $("#rest-lb").textContent=label;
  tickRest(); rest.iv=setInterval(tickRest,250);
}
function tickRest(){
  const left=Math.ceil((rest.end-Date.now())/1000), C=703.7;
  if(left<=0){ clearInterval(rest.iv); $("#rest-t").textContent="0:00"; $("#rest-mini").textContent="✓ 0:00"; $("#rest-sub").textContent=L().restGo; $("#rest-arc").style.strokeDashoffset=C;
    $("#rest").classList.add("end"); beep(); rest.hide=setTimeout(stopRest,5000); return; }
  const t=`${Math.floor(left/60)}:${pad(left%60)}`;
  $("#rest-t").textContent=t; $("#rest-mini").textContent=t; $("#rest-sub").textContent=L().restNow.toUpperCase();
  $("#rest-arc").style.strokeDashoffset=(C*(1-left/rest.total)).toFixed(1);
}
function stopRest(){ clearInterval(rest.iv); clearTimeout(rest.hide); $("#rest").classList.remove("on","end","mini"); }

/* ---------- scroll pickers for kg / reps ---------- */
const WH=44, FRACS=[0,.25,.5,.75];
function wheelHTML(id,items,idx){ return `<div class="wheel" id="${id}" data-idx="${idx}" tabindex="0"><div class="pad"></div>${items.map((t,i)=>`<div data-i="${i}">${t}</div>`).join("")}<div class="pad"></div></div>`; }
function wheelVal(id){ const el=$("#"+id); return el?Math.max(0,Math.min(el.querySelectorAll("div[data-i]").length-1,Math.round(el.scrollTop/WH))):0; }
function initWheels(){
  document.querySelectorAll(".wheel").forEach(el=>{
    el.scrollTop=(+el.dataset.idx)*WH;
    let last=-1; const upd=()=>{ const k=Math.round(el.scrollTop/WH); if(k===last) return; last=k; el.querySelectorAll("div[data-i]").forEach(d=>d.classList.toggle("on",+d.dataset.i===k)); try{ navigator.vibrate&&navigator.vibrate(4); }catch(e){} };
    upd(); el.addEventListener("scroll",()=>requestAnimationFrame(upd),{passive:true});
    el.addEventListener("click",e=>{ const d=e.target.closest("div[data-i]"); if(d) el.scrollTo({top:+d.dataset.i*WH,behavior:"smooth"}); });
    el.addEventListener("keydown",e=>{ if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); el.scrollTo({top:el.scrollTop+(e.key==="ArrowDown"?WH:-WH),behavior:"smooth"}); } });
  });
}
function pickCtx(i,j){ const isAbs=i==="abs", e=isAbs?draft.abs:draft.exercises[+i]; return {isAbs,e,s:e.sets[+j],noW:isAbs&&!ABS[e.key].weighted}; }
function openPicker(i,j){
  const L_=L(), {isAbs,e,s,noW}=pickCtx(i,j), ex=isAbs?ABS[e.key]:EX[e.key];
  let w=num(s.w); if(w==null){ const prev=e.sets.slice(0,+j).reverse().find(x=>num(x.w)!=null); w=prev?num(prev.w):(isAbs?0:20); }
  let r=num(s.r); if(r==null){ const tg=isAbs?null:targetsFor(e.key,e.method,hkOf(e.key,e.smith))[+j]; const m=tg&&String(tg.txt).match(/\d+/); r=m?+m[0]:10; }
  const wi=Math.max(0,Math.min(300,Math.floor(w))), fr=FRACS.reduce((b,f,k)=>Math.abs(w-wi-f)<Math.abs(w-wi-FRACS[b])?k:b,0);
  const wl=isAbs?L_.kg:(ex.assist?L_.kgAssist:(ex.perHand?L_.kgHand:L_.kg));
  const ints=Array.from({length:301},(_,k)=>k), reps=["–"].concat(Array.from({length:60},(_,k)=>k+1));

    <div class="pk${noW?" now":""}"><div class="pk-band"></div>${noW?"":wheelHTML("pk-wi",ints,wi)+wheelHTML("pk-wf",FRACS.map(f=>f?String(f).replace("0.","."):".0"),fr)}${wheelHTML("pk-r",reps,Math.min(60,r))}</div>
    <div class="pk-btns"><button type="button" class="btn" data-act="closemodal">${L_.no==="Tidak"?"Batal":"Cancel"}</button><button type="button" class="btn" data-act="pksave" data-i="${i}" data-j="${j}">${L_.wSave}</button></div>
    <button type="button" class="btn primary big" data-act="pkdone" data-i="${i}" data-j="${j}">${L_.wSave} & ${L_.pkDone} ✓</button>`);

function savePicker(i,j,done){

/* ---------- save / delete ---------- */
function computePRs(sess){
  const prs=[];
  for(const e of sess.exercises){
    if(EX[e.key].assist) continue;
    const cur=bestOf(e.sets), prev=entriesFor(e.hk,sess.id);
    if(!cur||!prev.length) continue;
    if(cur.v>Math.max(...prev.map(p=>bestOf(p.sets).v))+0.01) prs.push({hk:e.hk,w:cur.w,r:cur.r});
  }
  return prs;
}
async function saveSession(){
  const L_=L(), s=JSON.parse(JSON.stringify(draft));
  delete s.step;
  s.exercises.forEach(e=>{ e.hk=hkOf(e.key,e.smith); e.sets=e.sets.filter(validSet).map(x=>({w:num(x.w),r:num(x.r)})); });
  s.exercises=s.exercises.filter(e=>e.sets.length);
  if(s.abs){ s.abs.sets=s.abs.sets.filter(x=>num(x.r)>0).map(x=>({w:num(x.w)||0,r:num(x.r)})); if(!s.abs.sets.length) s.abs=null; }
  if(!s.exercises.length && !s.abs){ toast(L_.emptyWarn); return; }
  s.endedAt=new Date().toISOString();
  s.durationMin=Math.max(1,Math.round((new Date(s.endedAt)-new Date(s.startedAt))/60000));
  s.prs=computePRs(s); s.v=1; s.phase=phaseOf(s.workout); s.week=weekOf(s.date,s.phase);
  let ok=false;
  if(DB&&UID){ try{ await sessCol().doc(s.id).set(s); ok=true; }catch(e){} }
  if(!ok){ s._pending=true; if(DB&&UID){ DB=null; syncState="local"; renderSync(); } }
  localSessions=localSessions.filter(x=>x.id!==s.id).concat([s]); LS.set("tf_sessions",localSessions);
  if(cloudSessions&&ok&&!cloudSessions.some(x=>x.id===s.id)) cloudSessions=cloudSessions.concat([s]);
  draft=null; LS.del("tf_draft"); stopRest();
  const nSets=s.exercises.reduce((a,e)=>a+e.sets.length,0)+(s.abs?s.abs.sets.length:0);
  dTab=0; location.hash="#progress"; if(view==="progress") render();
  modal(`<div class="celebrate">${ring(1,110,10,"var(--good)",'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>')}<h2>${L_.summary}</h2><span class="muted">${s.workout==="ABS"?"Abs":"Workout "+s.workout} · ${fmtDate(s.date)}</span></div>
    <div class="tiles"><div class="tile" style="background:var(--surface2)"><b>${nSets}</b><span>${L_.setsDone}</span></div><div class="tile" style="background:var(--surface2)"><b>${s.durationMin}</b><span>${L_.mins}</span></div></div>
    ${s.prs.length?`<div><b>${L_.newPR}</b>${s.prs.map(p=>`<div class="row between" style="margin-top:6px"><span>${esc(hkLabel(p.hk))}</span><span class="chip pr num">${fmtN(p.w)} kg × ${p.r}</span></div>`).join("")}</div>`:""}
    <button type="button" class="btn primary big" data-act="closemodal">${L_.ok}</button>`);
}
async function deleteSession(id){
  if(DB&&UID){ try{ await sessCol().doc(id).delete(); }catch(e){} }
  if(cloudSessions) cloudSessions=cloudSessions.filter(s=>s.id!==id);
  localSessions=localSessions.filter(s=>s.id!==id); LS.set("tf_sessions",localSessions);
  render(true);
}

/* ---------- backup ---------- */
function backupJson(){ return JSON.stringify({app:"tiga-hari-gym",v:1,exportedAt:new Date().toISOString(),settings,weight,sessions:allSessions().map(s=>{const c={...s};delete c._pending;return c;})},null,1); }
function backupCsv(){
  const rows=[["date","phase","week","workout","exercise","method","smith","set","kg","reps"]];
  for(const s of allSessions().slice().reverse()){
    const ph=sessPhase(s), wk=weekOf(s.date,ph)||"";
    for(const e of (s.exercises||[])) (e.sets||[]).forEach((x,i)=>rows.push([s.date,ph,wk,s.workout,exName(e.key),METHODS[e.method]?METHODS[e.method].en:"",e.smith?"yes":"",i+1,x.w,x.r]));
    if(s.abs) s.abs.sets.forEach((x,i)=>rows.push([s.date,ph,wk,s.workout,exName(s.abs.key),"Straight Sets","",i+1,x.w,x.r]));
  }
  return rows.map(r=>r.map(c=>{c=String(c==null?"":c);return /[",\n]/.test(c)?`"${c.replace(/"/g,'""')}"`:c;}).join(",")).join("\n");
}
function showText(txt,msg){ const L_=L(); modal(`<h3>${msg||L_.copyJson}</h3><textarea id="bk-text" readonly>${esc(txt)}</textarea><div class="row"><button type="button" class="btn primary" data-act="copytext">${L_.copy}</button><button type="button" class="btn" data-act="closemodal">${L_.close}</button></div>`); }
let xlsxLoading=null;
function loadXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(!xlsxLoading) xlsxLoading=new Promise((res,rej)=>{ const sc=document.createElement("script"); sc.src="vendor/xlsx.full.min.js"; sc.onload=()=>res(window.XLSX); sc.onerror=()=>{xlsxLoading=null;rej(new Error("load"));}; document.head.appendChild(sc); });
  return xlsxLoading;
}
async function buildXlsx(){
  const X=await loadXLSX(), wb=X.utils.book_new(), list=allSessions();
  for(const ph of [1,2]) for(const wid of PHASES[ph]){
    const P=PROGRAM[wid], rows=[["Tarikh Mula :",settings.start[ph]],["Tarikh Tamat :",endOf(ph)],["*Nota Penting* - Total jumlah berat (KG) termasuk semua dengan jumlah berat batang barbell (20KG)"],[]];
    for(let wk=1; wk<=12; wk++){
      const ss=sessFor(list,wid,wk);
      rows.push([`Minggu ${wk}`, ss?ss.date:""]); rows.push(["Exercise","SET 1 (Paling Berat)","SET 2 (Pertengahan)","SET 3 (Paling Ringan)","Kaedah"]);
      P.slots.forEach((sl,i)=>{ const e=slotEntry(ss,i,P);
        const nm=(e?exName(e.key)+(e.smith?" (Smith)":""):sl.v.map(exName).join(" / "))+` - Rest ${sl.r.x}`;
        rows.push([nm].concat([0,1,2].map(k=>{const x=e&&e.sets[k];return x?`${fmtN(x.w)} KG / ${x.r} Reps`:"_ KG / _ Reps";}),[e?METHODS[e.method].en:""])); });
      rows.push([],[]);
    }
    const ws=X.utils.aoa_to_sheet(rows); ws["!cols"]=[{wch:58},{wch:22},{wch:22},{wch:22},{wch:18}];
    X.utils.book_append_sheet(wb,ws,`Workout ${wid}`);
  }
  const WE=weighIns(), wrows=[["Berat Badan"],["Sasaran (KG) :",weight.goal??""],["Tinggi (CM) :",weight.height??""],[],["Tarikh","Berat (KG)","Purata 7 Hari (KG)","Pinggang (CM)","BMI"]];
  WE.forEach((e,i)=>wrows.push([e.d,e.kg,Math.round(avg7(WE,i)*10)/10,num(e.waist)??"",num(weight.height)?Math.round(e.kg/((num(weight.height)/100)**2)*10)/10:""]));
  const wws=X.utils.aoa_to_sheet(wrows); wws["!cols"]=[{wch:14},{wch:12},{wch:18},{wch:14},{wch:8}]; X.utils.book_append_sheet(wb,wws,"Berat Badan");
  return new Blob([X.write(wb,{type:"array",bookType:"xlsx"})]);
}
function saveBlob(blob,fn){ const u=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=u; a.download=fn; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); }
async function doExport(kind){
  const L_=L();
  if(PWA){ try{ const fn=`tiga-hari-gym-${todayStr()}.${kind}`;
      const blob = kind==="xlsx" ? await buildXlsx() : new Blob([kind==="csv"?"\ufeff"+backupCsv():backupJson()],{type:kind==="csv"?"text/csv":"application/json"});
      saveBlob(blob,fn); }catch(e){ showText(kind==="csv"?backupCsv():backupJson(),L_.dlFail); } return; }
  if(kind==="xlsx"){
    if(!DL){ showText(backupCsv(),L_.dlFail); return; }
    let blob; try{ blob=await buildXlsx(); }catch(e){ toast(L_.dlFail); return; }
    try{ await DL.save({filename:`tiga-hari-gym-${todayStr()}.xlsx`,data:blob}); }catch(e){ if(!(e&&e.code==="declined")) toast(L_.dlFail); }
    return;
  }
  const data=kind==="csv"?backupCsv():backupJson(), fn=`tiga-hari-gym-${todayStr()}.${kind}`;
  if(DL){ try{ await DL.save({filename:fn,data}); return; }catch(e){ if(e&&e.code==="declined") return; } }
  showText(data,L_.dlFail);
}
async function importData(text){
  const L_=L(); let obj;
  try{ obj=JSON.parse(text); }catch(e){ toast(L_.importBad); return; }
  const arr=Array.isArray(obj)?obj:obj&&obj.sessions;
  if(!Array.isArray(arr)){ toast(L_.importBad); return; }
  const have=new Set(allSessions().map(s=>s.id)); let n=0;
  for(const s of arr){
    if(!s||!s.id||!s.date||!s.workout||have.has(s.id)) continue;
    const c={...s}; delete c._pending; let ok=false;
    if(DB&&UID){ try{ await sessCol().doc(c.id).set(c); ok=true; }catch(e){} }
    if(!ok) c._pending=true;
    localSessions.push(c); if(cloudSessions&&ok) cloudSessions.push(c); n++;
  }
  if(obj&&obj.weight&&Array.isArray(obj.weight.entries)){ const have=new Set((weight.entries||[]).map(e=>e.d)); weight.entries=(weight.entries||[]).concat(obj.weight.entries.filter(e=>e&&e.d&&num(e.kg)&&!have.has(e.d))).sort((a,b)=>a.d.localeCompare(b.d)); if(weight.goal==null&&obj.weight.goal!=null) weight.goal=obj.weight.goal; if(weight.height==null&&obj.weight.height!=null) weight.height=obj.weight.height; saveWeight(); }
  LS.set("tf_sessions",localSessions); toast(`${n} ${L_.importDone}`); render(true);
}

let setT=null;
function queueSettingsWrite(){ if(!DB||!UID) return; clearTimeout(setT); setT=setTimeout(async()=>{ try{ await DB.doc(`data/users/${UID}/settings`).set({...settings}); }catch(e){} },800); }
async function uploadPending(){

async function initCloud(){
  let tries=0;
  while(!(window.claude&&typeof window.claude.use==="function") && tries<20){ await new Promise(r=>setTimeout(r,250)); tries++; }
  const local=()=>{ syncState="local"; renderSync(); if(view==="settings") render(true); };
  if(!(window.claude&&typeof window.claude.use==="function")) return local();
  try{
    const [db,user,dl]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("downloads").catch(()=>null)]);
    DL=dl||null;
    const id=user?await user.id():null;
    let canW=null; try{ canW=user&&user.can?await user.can("data.write"):null; }catch(e){}
    if(!db||!id||canW===false) return local();
    DB=db; UID=id;
    try{ const sd=await DB.doc(`data/users/${UID}/settings`).get(); if(sd.exists){ const d=sd.data()||{}; settings=Object.assign({},settings,d,{start:Object.assign({},settings.start,d.start||{}),days:Object.assign({},settings.days,d.days||{})}); LS.set("tf_settings",settings); } else queueSettingsWrite(); }catch(e){}
    try{ const wd=await DB.doc(`data/users/${UID}/weight`).get();
      if(wd.exists){ const c=wd.data()||{}, cm=new Map((c.entries||[]).map(e=>[e.d,e])); let add=false;
        for(const e of (weight.entries||[])) if(!cm.has(e.d)){ cm.set(e.d,e); add=true; }
        weight={goal:c.goal??weight.goal??null,height:c.height??weight.height??null,entries:[...cm.values()].sort((a,b)=>a.d.localeCompare(b.d))};
        LS.set("tf_weight",weight); if(add) saveWeight(); }
      else if((weight.entries||[]).length||weight.goal!=null) saveWeight();
    }catch(e){}
    const timer=setTimeout(()=>{ if(syncState!=="cloud"){ syncState="local"; renderSync(); } },10000);
    let first=true;
    sessCol().onSnapshot(snap=>{
      cloudSessions=snap.docs.map(d=>d.data()).filter(Boolean);
      if(!snap.metadata.fromCache){
        clearTimeout(timer); syncState="cloud";
        if(first){ first=false; uploadPending(); }
        const ids=new Set(cloudSessions.map(s=>s.id));
        localSessions=cloudSessions.map(s=>({...s})).concat(localSessions.filter(s=>s._pending&&!ids.has(s.id)));
        LS.set("tf_sessions",localSessions);
      }
      renderSync(); if(view!=="log") render(true);
    }, err=>{ clearTimeout(timer); DB=null; local(); });
  }catch(e){ local(); }
}

/* ---------- events ---------- */
document.addEventListener("click",async ev=>{
  const el=ev.target.closest("[data-act]"); if(!el) return;
  const a=el.dataset.act, v=el.dataset.v, i=el.dataset.i, j=el.dataset.j;
  switch(a){
    case "lang": settings.lang=v; saveSettings(); render(true); break;
    case "phase": settings.phase=+v; gPhase=null; saveSettings(); render(true); break;
    case "start":
      if(!draft){ newDraft(v); saveDraft(); }
      if(view==="log") render(); else location.hash="#log"; break;
    case "step": { const n=draft.exercises.length; draft.step=Math.max(0,Math.min(n,+v)); saveDraft(); render(); window.scrollTo(0,0); break; }
    case "variant": { const e=draft.exercises[i]; if(e.key!==v){ e.key=v; if(!EX[v].compound) e.smith=false; applyTargets(e); saveDraft(); render(true);} break; }
    case "method": { const e=draft.exercises[i]; e.method=v; applyTargets(e); saveDraft(); render(true); break; }
    case "addset": { const e=draft.exercises[i]; e.sets.push({w:e.sets.length?e.sets[e.sets.length-1].w:"",r:"",d:false}); saveDraft(); render(true); break; }
    case "done": {
      const isAbs=i==="abs", e=isAbs?draft.abs:draft.exercises[i], s=e.sets[j];
      s.d=!s.d; saveDraft();
      $(`#row-${i}-${j}`).classList.toggle("done",s.d); el.setAttribute("aria-pressed",s.d);
      if(s.d) startRest(isAbs?90:PROGRAM[draft.workout].slots[e.slot].r.s, `${exName(e.key)} · ${L().set} ${+j+1}`);
      break; }
    case "rest-add": rest.end+=(+v)*1000; rest.total=Math.max(rest.total+(+v),1); if(!$("#rest").classList.contains("end")) tickRest(); break;
    case "rest-stop": stopRest(); break;
    case "demopp": toggleDemos(); break;
    case "pick": openPicker(i,j); break;
    case "pksave": savePicker(i,j,false); break;
    case "pkdone": savePicker(i,j,true); break;
    case "rest-min": $("#rest").classList.add("mini"); break;
    case "rest-max": if($("#rest").classList.contains("end")) stopRest(); else $("#rest").classList.remove("mini"); break;
    case "save": el.disabled=true; await saveSession(); el.disabled=false; break;
    case "cancel": modal(`<p>${L().cancelQ}</p><div class="row"><button type="button" class="btn danger" data-act="cancelyes">${L().yes}</button><button type="button" class="btn" data-act="closemodal">${L().no}</button></div>`); break;
    case "cancelyes": draft=null; LS.del("tf_draft"); stopRest(); closeModal(); render(); break;
    case "dtab": dTab=+v; render(true); break;
    case "towt": dTab=1; if(view==="progress") render(); break;
    case "wlog": wLogModal(); break;
    case "wgoal": wGoalModal(); break;
    case "wsave": { const d=$("#wi-d").value||todayStr(), kg=num($("#wi-kg").value), wa=num($("#wi-w").value);
      if(kg==null||kg<20||kg>300){ toast(L().wBad); break; }
      weight.entries=(weight.entries||[]).filter(e=>e.d!==d).concat([{d,kg,waist:wa}]).sort((a,b)=>a.d.localeCompare(b.d));
      saveWeight(); closeModal(); toast(L().wSaved); render(true); break; }
    case "wgoalsave": { const g=num($("#wg-goal").value), hh=num($("#wg-h").value);
      weight.goal=(g!=null&&g>=20&&g<=300)?g:null; weight.height=(hh!=null&&hh>=100&&hh<=250)?hh:null; saveWeight(); closeModal(); render(true); break; }
    case "wdelask": modal(`<p>${L().wDelQ}</p><div class="row"><button type="button" class="btn danger" data-act="wdelyes" data-v="${esc(v)}">${L().del}</button><button type="button" class="btn" data-act="closemodal">${L().no}</button></div>`); break;
    case "wdelyes": weight.entries=(weight.entries||[]).filter(e=>e.d!==v); saveWeight(); closeModal(); render(true); break;
    case "gtab": gridW=v; render(true); break;
    case "gtabg": gTab=+v; render(true); break;
    case "gwork": gWork=v; render(true); break;
    case "gphase": gPhase=+v; render(true); break;
    case "lift": openLift=openLift===v?null:v; render(true); break;
    case "hopen": if(ev.target.closest("[data-act='delask']")) break; openHist=openHist===v?null:v; render(true); break;
    case "delask": ev.stopPropagation(); modal(`<p>${L().delQ}</p><div class="row"><button type="button" class="btn danger" data-act="delyes" data-v="${esc(v)}">${L().del}</button><button type="button" class="btn" data-act="closemodal">${L().no}</button></div>`); break;
    case "delyes": closeModal(); await deleteSession(v); break;
    case "closemodal": closeModal(); break;
    case "export": doExport(v); break;
    case "copyjson": { const t=backupJson(); try{ await navigator.clipboard.writeText(t); toast(L().copied);}catch(e){ showText(t); } break; }
    case "copytext": { const ta=$("#bk-text"); if(ta){ ta.select(); try{ await navigator.clipboard.writeText(ta.value); toast(L().copied);}catch(e){ toast(L().copyFail);} } break; }
    case "import": $("#import-file").click(); break;
  }
});
document.addEventListener("keydown",ev=>{
  if((ev.key==="Enter"||ev.key===" ") && ev.target.matches(".hist")){ ev.preventDefault(); ev.target.click(); }
  if(ev.key==="Escape") closeModal();
});
document.addEventListener("input",ev=>{
  const el=ev.target, k=el.dataset.in; if(!k||!draft) return;
  if(k==="w"||k==="r"){ const e=el.dataset.i==="abs"?draft.abs:draft.exercises[el.dataset.i]; const s=e.sets[el.dataset.j]; s[k]=el.value; if(k==="w") s.auto=false; saveDraft(); }
  else if(k==="bw"){ draft.bw=el.value; saveDraft(); }
  else if(k==="notes"){ draft.notes=el.value; saveDraft(); }
});
document.addEventListener("change",ev=>{
  const el=ev.target, k=el.dataset.in; if(!k) return;
  if(k==="smith"){ const e=draft.exercises[el.dataset.i]; e.smith=el.checked; applyTargets(e); saveDraft(); render(true); }
  else if(k==="abs"){ const v=el.value; if(!v) draft.abs=null; else if(!draft.abs) draft.abs={key:v,sets:[0,1,2].map(()=>({w:"",r:"",d:false}))}; else draft.abs.key=v; saveDraft(); render(true); }
  else if(k==="start"){ if(el.value){ settings.start[settings.phase]=el.value; saveSettings(); render(true);} }
  else if(k==="day"){ settings.days[el.dataset.w]=+el.value; saveSettings(); render(true); }
});
$("#import-file").addEventListener("change",ev=>{ const f=ev.target.files&&ev.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>importData(String(r.result)); r.readAsText(f); ev.target.value=""; });
window.addEventListener("hashchange",go);
setInterval(()=>{ const el=$("#elapsed"); if(el&&draft) el.textContent=Math.max(0,Math.round((Date.now()-new Date(draft.startedAt))/60000)); },30000);

(function(){ const sp=$("#splash"); let seen=false; try{ seen=sessionStorage.getItem("thg_splash")==="1"; sessionStorage.setItem("thg_splash","1"); }catch(e){}
  if(settings.lang==="en") $("#splash-sub").textContent="Gym guide & log for beginners";
  const hide=()=>{ sp.classList.add("out"); setTimeout(()=>sp.remove(),500); };
  if(seen) sp.remove(); else { sp.addEventListener("click",hide); setTimeout(hide,1900); } })();
go();
syncState="local"; renderSync();
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
if("serviceWorker" in navigator){ window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }); }
</script>
